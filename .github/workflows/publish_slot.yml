name: publish_slot

# 매 slot 시각(07/11/17/20 KST)에 노션 모먼트 fetch + FB/IG/Threads 게시.
# GitHub Actions schedule cron은 정각 큐잉 지연으로 자주 누락되어 제거 (2026-05-13).
# Cloudflare Worker(infra/cloudflare-worker/)가 정시 workflow_dispatch API 호출 → 이 workflow trigger.
# workflow_dispatch 인자 skip_time_filter=true면 backlog 일괄 처리 (시간 필터 우회).

on:
  workflow_dispatch:
    inputs:
      skip_time_filter:
        description: 'true면 모든 scheduled 모먼트 처리 (backlog 일괄)'
        required: false
        default: 'false'
      dry_run:
        description: 'true면 실제 게시 X (Worker→workflow 통신 검증용)'
        required: false
        default: 'false'

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies (slim — no ML/video libs)
        run: |
          pip install --upgrade pip
          # publish_socials_from_notion이 필요한 deps만 (transcribe/scene/analyze 무관)
          pip install \
            httpx \
            pydantic \
            pydantic-settings \
            structlog \
            tenacity \
            notion-client \
            google-api-python-client \
            google-auth-oauthlib \
            google-auth-httplib2 \
            boto3 \
            click

      - name: Run publish_socials_from_notion
        env:
          # repo root을 PYTHONPATH에 — `from app.config import settings` 가능하도록.
          PYTHONPATH: ${{ github.workspace }}
          # Notion
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_SHORTS_DB_ID: ${{ secrets.NOTION_SHORTS_DB_ID }}
          # R2 (URL 구성에 필요)
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          R2_S3_ENDPOINT: ${{ secrets.R2_S3_ENDPOINT }}
          # Meta (Facebook Page)
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          # Instagram (별도 OAuth)
          INSTAGRAM_APP_ID: ${{ secrets.INSTAGRAM_APP_ID }}
          INSTAGRAM_APP_SECRET: ${{ secrets.INSTAGRAM_APP_SECRET }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          # Threads (별도 OAuth, me endpoint 사용)
          THREADS_APP_ID: ${{ secrets.THREADS_APP_ID }}
          THREADS_APP_SECRET: ${{ secrets.THREADS_APP_SECRET }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          # TikTok은 영빈 PC에서 Buffer queue 직접 push (영빈 결정 2026-05-13).
          # workflow_dispatch에서 입력값 전달
          SKIP_TIME_FILTER: ${{ github.event.inputs.skip_time_filter }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          python scripts/publish_socials_from_notion.py
