# Cloudflare Worker — SwingCrew 게시 cron trigger.
# 2번/일 (11/20 KST) GitHub workflow_dispatch 호출.
# 영빈 결정 2026-07-13: 4슬롯 → 2슬롯 (07/17시 제거 — 성과 하위 슬롯,
# 재고 수급 주 10~16개에 맞춤). 화/금 20시는 스케줄러가 할당 자체를 안 하므로
# 워커는 매일 발사해도 무해 (±15분 필터가 빈 슬롯이면 no-op).

name = "swingcrew-shorts-auto"
main = "src/index.js"
compatibility_date = "2024-09-01"

[triggers]
# UTC 기준 — KST(+9) 환산:
#   02:00 UTC = 11:00 KST
#   11:00 UTC = 20:00 KST
crons = [
  "0 2 * * *",
  "0 11 * * *",
]

# Secrets는 wrangler secret put 또는 Cloudflare dashboard에서 등록:
#   GITHUB_PAT    — GitHub Personal Access Token (workflow scope)
#   GITHUB_OWNER  — repo owner (예: davidhan-biz)
#   GITHUB_REPO   — repo name (예: swingcrew-auto-shorts)
#   MANUAL_TOKEN  — /trigger endpoint 인증용 (임의 문자열)
