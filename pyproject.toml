[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "swingcrew-shorts"
version = "0.1.0"
description = "SwingCrew YouTube 미드폼 → 숏츠 자동화"
requires-python = ">=3.11,<3.13"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
    "google-generativeai>=0.7.0",
    "google-api-python-client>=2.140.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",
    "yt-dlp>=2024.8.0",
    "whisperx>=3.1.1",
    "torch>=2.4,<2.5",
    "torchaudio>=2.4,<2.5",
    "torchvision>=0.19,<0.20",
    "opencv-python>=4.10.0",
    "mediapipe>=0.10.14",
    "Pillow>=10.4.0",
    "notion-client>=2.2.1",
    "sqlite-utils>=3.37",
    "click>=8.1.7",
    "setuptools>=70,<80",
    "speechbrain>=1.0,<1.1",
    "boto3>=1.35,<2",
    "ultralytics>=8.4,<9",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]

# CUDA PyTorch (WhisperX 가속용)
[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["E501"]

[tool.pytest.ini_options]
markers = [
    "slow: 시간 오래 걸리는 테스트 (영상 처리)",
    "external: 실제 외부 API 호출 (네트워크 필요)",
]
addopts = "-m 'not slow and not external'"
