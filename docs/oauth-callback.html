<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SwingCrew OAuth Callback</title>
<style>
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 720px; margin: 40px auto; padding: 0 20px; color: #222; }
h1 { font-size: 24px; }
.code-box { background: #f4f4f4; padding: 20px; border-radius: 8px; border: 1px solid #ddd; margin: 20px 0; font-family: monospace; font-size: 16px; word-break: break-all; }
button { background: #007aff; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 14px; }
button:hover { background: #0056b3; }
.success { color: #16a34a; }
.error { color: #dc2626; }
.muted { color: #666; font-size: 13px; }
</style>
</head>
<body>
<h1>SwingCrew OAuth Callback</h1>
<div id="result"></div>

<script>
const params = new URLSearchParams(window.location.search);
const code = params.get("code");
const state = params.get("state");
const error = params.get("error");
const errorDescription = params.get("error_description");

const result = document.getElementById("result");

if (error) {
  result.innerHTML = `<p class="error"><strong>OAuth Error:</strong> ${error}</p><p class="muted">${errorDescription || ""}</p>`;
} else if (code) {
  result.innerHTML = `
    <p class="success">Authorization successful.</p>
    <p>Copy the authorization code below and paste it into the Python script prompt:</p>
    <div class="code-box" id="codeBox">${code}</div>
    <button onclick="copyCode()">Copy code</button>
    <p class="muted" style="margin-top: 24px;">state: ${state || "(none)"}</p>
  `;
} else {
  result.innerHTML = `<p class="error">No authorization code found in URL.</p><p class="muted">Expected query: <code>?code=...&state=...</code></p>`;
}

function copyCode() {
  const code = document.getElementById("codeBox").innerText;
  navigator.clipboard.writeText(code).then(() => {
    alert("Copied to clipboard.");
  });
}
</script>
</body>
</html>
